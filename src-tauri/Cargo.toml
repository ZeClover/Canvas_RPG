[package]
name = "rpg-canvas-studio"
version = "1.0.4"
description = "Canvas visual local-first para campanhas de RPG"
authors = ["Zé Clover"]
edition = "2021"

[lib]
name = "rpg_canvas_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
uuid = { version = "1", features = ["v4", "v5"] }
